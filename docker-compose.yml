# HEC Emergency Fund — production docker-compose.
# Brings up PostgreSQL, the Django backend, a Celery worker, and a beat
# scheduler. Caddy (or your reverse proxy of choice) terminates TLS and
# forwards traffic to the backend on port 8000.

x-base-env: &base-env
  DJANGO_SETTINGS_MODULE: hec_fund.settings.prod
  DB_NAME: ${DB_NAME:-hec}
  DB_USER: ${DB_USER:-hec}
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
  DB_HOST: db
  DB_PORT: 5432
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
  APPROVAL_HMAC_SECRET: ${APPROVAL_HMAC_SECRET:?set APPROVAL_HMAC_SECRET in .env}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3001}
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-false}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
  CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-false}
  # Object store (S3-compatible). Leave AWS_S3_ENDPOINT_URL blank to use
  # the local file-system fallback for dev.
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-hec-attachments}
  AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
  AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-eu-central-1}
  MOOV_MONEY_API_URL: ${MOOV_MONEY_API_URL:-}
  MOOV_MONEY_API_KEY: ${MOOV_MONEY_API_KEY:-}
  AIRTEL_MONEY_API_URL: ${AIRTEL_MONEY_API_URL:-}
  AIRTEL_MONEY_API_KEY: ${AIRTEL_MONEY_API_KEY:-}
  ACCELERATED_BENEFIT_PCT: ${ACCELERATED_BENEFIT_PCT:-20}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-hec}
      POSTGRES_USER: ${DB_USER:-hec}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hec} -d ${DB_NAME:-hec}"]
      interval: 10s
      timeout: 5s
      retries: 6

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: hec-backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *base-env
    volumes:
      - backend-static:/app/staticfiles
      - backend-media:/app/media
      - ./backend/files:/app/files
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn hec_fund.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile - --timeout 120"

  celery-worker:
    image: hec-backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *base-env
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - backend
      - redis
    volumes:
      - backend-media:/app/media
    command: celery -A hec_fund worker --loglevel=info

  celery-beat:
    image: hec-backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *base-env
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - backend
      - redis
    command: celery -A hec_fund beat --loglevel=info

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  frontend:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend-dist:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend-builder:
    image: oven/bun:1-slim
    working_dir: /build
    volumes:
      - ./frontend:/build
      - frontend-dist:/build/dist
      - node-modules:/build/node_modules
    command: sh -c "bun install --frozen-lockfile && bunx vite build"

volumes:
  db-data:
  backend-static:
  backend-media:
  redis-data:
  frontend-dist:
  node-modules: