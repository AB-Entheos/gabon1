# nginx.conf — Ubuntu 22.04 single-VPS deployment for HEC Emergency Fund
# Copy to /etc/nginx/sites-available/hec and symlink to sites-enabled.

upstream hec_django {
    server 127.0.0.1:8001;
}

upstream hec_vite_preview {
    server 127.0.0.1:5173;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name hec.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hec.example.com;

    ssl_certificate /etc/letsencrypt/live/hec.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hec.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # CSP — strict default, allow S3/MinIO endpoint for image src.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://your-s3-endpoint.example; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://your-s3-endpoint.example; frame-ancestors 'none';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    client_max_body_size 30m;

    # Static files served by WhiteNoise (Django) — proxied through Gunicorn
    location /static/ {
        proxy_pass http://hec_django;
        proxy_set_header Host $host;
    }

    # API + Django admin
    location /api/ {
        proxy_pass http://hec_django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /admin/ {
        proxy_pass http://hec_django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://hec_django;
    }

    # Frontend (production preview build from Vite)
    location / {
        proxy_pass http://hec_vite_preview;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
