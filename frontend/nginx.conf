# Frontend nginx config used by docker-compose. Serves the built static
# files from /usr/share/nginx/html and reverse-proxies /api/* to the
# backend container.
#
# Docker's internal DNS is at 127.0.0.11.  Using a variable in proxy_pass
# forces nginx to resolve the hostname on every request instead of at
# startup, so it survives backend restarts / IP changes.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  server_name hec.ab-entheos.com;

  root /usr/share/nginx/html;
  index index.html;

  # Long cache for the Vite-built JS/CSS bundles.
  location ~* \.(?:js|css|woff2?|ttf|otf|png|jpg|jpeg|gif|svg|ico)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  # API + uploads go straight to the Django backend.
  location /api/ {
    set $backend_upstream http://backend:8000;
    proxy_pass         $backend_upstream;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_read_timeout 120s;
    client_max_body_size 30m;
  }

  # Health check endpoint
  location /health {
    set $backend_upstream http://backend:8000;
    proxy_pass         $backend_upstream;
    proxy_set_header   Host $host;
  }

  # Admin proxy
  location /admin/ {
    set $backend_upstream http://backend:8000;
    proxy_pass         $backend_upstream;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # SPA fallback: any unknown path serves index.html so Vite's client-side
  # router can take over.
  location / {
    try_files $uri $uri/ /index.html;
  }
}