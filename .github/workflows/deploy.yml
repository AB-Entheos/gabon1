name: Deploy to Production

on:
  push:
    branches: [main]

env:
  DEPLOY_PATH: /opt/hec

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e

            echo "==> Fixing repository ownership..."
            sudo chown -R $USER:$(id -gn) ${{ env.DEPLOY_PATH }}

            echo "==> Configuring git safe directory..."
            git config --global --add safe.directory '*'

            # Ensure docker is in PATH for ubuntu user
            export PATH="$PATH:/usr/bin:/usr/local/bin:/snap/bin"

            # Install docker & compose if missing
            if ! command -v docker &> /dev/null; then
              echo "==> Installing Docker..."
              sudo apt-get update -qq
              sudo apt-get install -y -qq docker.io docker-compose-v2
              sudo usermod -aG docker $USER
              sudo systemctl enable --now docker
            fi

            # Add swap if missing (prevents OOM during builds)
            if [ ! -f /swapfile ]; then
              echo "==> Creating 2GB swap..."
              sudo fallocate -l 2G /swapfile
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
            fi

            # Open firewall ports if ufw is active
            if sudo ufw status | grep -q "active"; then
              echo "==> Opening firewall ports..."
              sudo ufw allow 80/tcp
              sudo ufw allow 443/tcp
              sudo ufw allow 3001/tcp
              sudo ufw reload
            fi

            cd ${{ env.DEPLOY_PATH }}
            git fetch origin main
            git reset --hard origin/main

            # .env is gitignored so reset won't touch it.
            # Create it from example on first deploy only.
            if [ ! -f .env ]; then
              echo "==> Creating .env from .env.example..."
              cp .env.example .env
              SECRET_VAL=$(openssl rand -hex 32)
              sed -i "s|SECRET_KEY=.*|SECRET_KEY=$SECRET_VAL|" .env
              sed -i "s|DJANGO_SETTINGS_MODULE=.*|DJANGO_SETTINGS_MODULE=hec_fund.settings.prod|" .env
              sed -i "s|ALLOWED_HOSTS=.*|ALLOWED_HOSTS=localhost,127.0.0.1,hec.ab-entheos.com|" .env
              sed -i "s|CORS_ALLOWED_ORIGINS=.*|CORS_ALLOWED_ORIGINS=https://hec.ab-entheos.com,http://hec.ab-entheos.com|" .env
              sed -i "s|DB_PASSWORD=.*|DB_PASSWORD=$(openssl rand -hex 16)|" .env
              sed -i "s|APPROVAL_HMAC_SECRET=.*|APPROVAL_HMAC_SECRET=$(openssl rand -hex 32)|" .env
            fi

            echo "==> Building frontend (Bun)..."
            sudo docker compose run --rm frontend-builder

            echo "==> Building backend image..."
            sudo docker compose build backend

            echo "==> Running migrations..."
            sudo docker compose run --rm backend python manage.py migrate --noinput
            sudo docker compose run --rm backend python manage.py compilemessages || true
            sudo docker compose run --rm backend python manage.py collectstatic --noinput

            echo "==> Seeding demo data (idempotent)..."
            sudo docker compose run --rm backend python manage.py seed_demo_data || true

            echo "==> Seeding production users..."
            sudo docker compose run --rm backend python manage.py seed_real_data || true

            echo "==> Ensuring files directory is writable..."
            mkdir -p /opt/hec/backend/files
            chmod -R 777 /opt/hec/backend/files || true

            echo "==> Restarting services..."
            sudo docker compose down
            sudo docker compose up -d

            echo "==> Waiting for health check..."
            sleep 15
            for i in 1 2 3 4 5 6; do
              if curl -fsS http://localhost/api/v1/health > /dev/null 2>&1; then
                echo "✅ Backend healthy"
                break
              fi
              echo "  Attempt $i failed, waiting 10s..."
              sleep 10
            done

            if ! curl -fsS http://localhost/api/v1/health > /dev/null 2>&1; then
              echo "❌ Backend health check failed"
              sudo docker compose logs backend --tail=30
              exit 1
            fi

            echo "==> Deploy complete!"
            sudo docker compose ps
